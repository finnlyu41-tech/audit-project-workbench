name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify and build
        run: pnpm check
      - name: Stamp build commit
        run: printf '%s\n' "$GITHUB_SHA" > dist/apw-build-sha.txt
      - name: Upload browser-test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-playwright-report
          path: |
            playwright-report
            test-results
            test-results-production
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify deployed commit and core assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          page_url = os.environ["PAGE_URL"].rstrip("/") + "/"
          expected_sha = os.environ["EXPECTED_SHA"].strip()

          def fetch(url, attempts=12):
              last_error = None
              for attempt in range(attempts):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "APW-Pages-smoke"},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          return response.geturl(), response.read()
                  except Exception as exc:
                      last_error = exc
                      if attempt + 1 < attempts:
                          time.sleep(5)
              raise SystemExit(f"Unable to fetch {url}: {last_error}")

          _, sha_bytes = fetch(urllib.parse.urljoin(page_url, "apw-build-sha.txt"))
          deployed_sha = sha_bytes.decode("utf-8").strip()
          if deployed_sha != expected_sha:
              raise SystemExit(
                  f"Deployed commit mismatch: expected {expected_sha}, got {deployed_sha}"
              )

          final_url, html_bytes = fetch(page_url)
          html = html_bytes.decode("utf-8")
          for marker in (
              "<title>APW — Audit Project Workbench</title>",
              '<div id="root"></div>',
          ):
              if marker not in html:
                  raise SystemExit(f"Deployed page is missing marker: {marker}")

          asset_refs = sorted(
              set(re.findall(r'(?:src|href)="([^"]+\.(?:js|css))"', html))
          )
          if not asset_refs:
              raise SystemExit("Deployed page does not reference any JS/CSS assets")

          for ref in asset_refs:
              asset_url = urllib.parse.urljoin(final_url, ref)
              _, asset_bytes = fetch(asset_url)
              if not asset_bytes:
                  raise SystemExit(f"Deployed asset is empty: {asset_url}")

          print(
              f"Verified deployed APW commit {deployed_sha} with "
              f"{len(asset_refs)} reachable JS/CSS assets."
          )
          PY
