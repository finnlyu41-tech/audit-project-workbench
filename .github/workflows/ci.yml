name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded checks for the same PR, never an active production release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Unit tests
        id: unit
        run: pnpm test
      - name: Browser regression
        id: browser
        run: pnpm test:e2e
      - name: Production build
        id: build
        run: pnpm build
      - name: Production browser regression
        id: production
        run: pnpm test:production
      - name: Record exact-commit verification receipt
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOME_UNIT: ${{ steps.unit.outcome }}
          OUTCOME_BROWSER: ${{ steps.browser.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_PRODUCTION: ${{ steps.production.outcome }}
        run: node scripts/verification-receipt.mjs
      - name: Upload browser-test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            test-results-production
            playwright-results
          if-no-files-found: warn
          retention-days: 14
