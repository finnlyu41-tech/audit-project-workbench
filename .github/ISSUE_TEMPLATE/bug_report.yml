name: Bug report
description: Report a reproducible problem without including client data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real engagement backups, client names or confidential screenshots.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all client and confidential information.
          required: true
